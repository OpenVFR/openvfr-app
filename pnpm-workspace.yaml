packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  workerd: true

# Expo's optional react-dom peer (@expo/router-server, web-only, never bundled
# into the native app) is pinned to the same line as apps/native's react
# (19.3.0, RN 0.88's peer), so it cannot pull a react-dom whose own peer
# mismatches it.
overrides:
  "@expo/router-server>react-dom": "19.3.0"
  # Optional peer of react-native's CLI plugin: keep it on the same line as
  # react-native (0.88.x) instead of floating to the newest release.
  "@react-native/metro-config": "0.88.1"
  # sp-react-native-in-app-updates pins underscore 1.12 (DoS in _.flatten/_.isEqual).
  underscore: "^1.13.8"
  # openai (api) pulls undici <7.30.1: DoS via excessive content-encodings /
  # unbounded EventSource parser memory (GHSA advisories, fixed in 7.30.1).
  undici: "^7.30.1"
  # rxdb / workbox-build pull fast-uri <3.1.9 (URI host/scheme confusion).
  fast-uri: "^3.1.9"

patchedDependencies:
  '@expo/ui@58.0.27': patches/@expo__ui@58.0.27.patch
  '@maplibre/maplibre-react-native@11.5.1': patches/@maplibre__maplibre-react-native@11.5.1.patch
  react-native-svg@15.16.1: patches/react-native-svg@15.16.1.patch
