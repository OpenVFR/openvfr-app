packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  workerd: true

# The assistant connection's auth packages (better-auth 1.7.20 and its plugins, which must all be the same
# version) are exempt from the release-age delay, because 1.7.20 was newer than the delay when it was adopted.
# These are auth packages, where the delay matters most: remove this list as soon as 1.7.20 is older than
# `minimumReleaseAge`, or on the next better-auth upgrade.
minimumReleaseAgeExclude:
  - "@better-auth/cimd@1.7.20"
  - "@better-auth/core@1.7.20"
  - "@better-auth/drizzle-adapter@1.7.20"
  - "@better-auth/kysely-adapter@1.7.20"
  - "@better-auth/mcp@1.7.20"
  - "@better-auth/memory-adapter@1.7.20"
  - "@better-auth/mongo-adapter@1.7.20"
  - "@better-auth/oauth-provider@1.7.20"
  - "@better-auth/passkey@1.7.20"
  - "@better-auth/prisma-adapter@1.7.20"
  - "@better-auth/telemetry@1.7.20"
  - better-auth@1.7.20
  # Expo SDK 58.1 first-party packages (expo 58.1.0 and the patch releases `expo install --check` expects with it) were newer than the delay
  # when they were adopted. Remove these lines once they are older than `minimumReleaseAge`, or on the next Expo upgrade.
  - expo-dev-client@58.0.20 || 58.0.22
  - expo-dev-launcher@58.0.20 || 58.1.0
  - expo-location@58.0.22 || 58.0.23
  - expo@58.0.25 || 58.1.0
  - "@expo/cli@58.1.22"
  - "@expo/config-plugins@58.0.14"
  - "@expo/config@58.0.13"
  - "@expo/fingerprint@0.22.0"
  - "@expo/inline-modules@0.2.11"
  - "@expo/local-build-cache-provider@58.0.13"
  - "@expo/metro-config@58.0.24"
  - "@expo/metro-file-map@58.0.7"
  - "@expo/prebuild-config@58.0.21"
  - "@expo/router-server@58.0.24"
  - babel-preset-expo@58.0.27
  - expo-crypto@58.0.9
  - expo-file-system@58.0.15
  - expo-modules-core@58.2.0
  - expo-modules-jsi@58.0.24
  - expo-sharing@58.0.24
  - expo-splash-screen@58.0.15
  - "@expo/ui@58.0.30"

# Expo's optional react-dom peer (@expo/router-server, web-only, never bundled
# into the native app) is pinned to the same line as apps/native's react
# (19.3.0, RN 0.88's peer), so it cannot pull a react-dom whose own peer
# mismatches it.
overrides:
  "@expo/router-server>react-dom": "19.3.0"
  # Optional peer of react-native's CLI plugin: keep it on the same line as
  # react-native (0.88.x) instead of floating to the newest release.
  "@react-native/metro-config": "0.88.1"
  # sp-react-native-in-app-updates pins underscore 1.12 (DoS in _.flatten/_.isEqual).
  underscore: "^1.13.8"
  # openai (api) pulls undici <7.30.1: DoS via excessive content-encodings /
  # unbounded EventSource parser memory (GHSA advisories, fixed in 7.30.1).
  undici: "^7.30.1"
  # rxdb / workbox-build pull fast-uri <3.1.9 (URI host/scheme confusion).
  fast-uri: "^3.1.9"

patchedDependencies:
  '@expo/ui@58.0.30': patches/@expo__ui@58.0.30.patch
  '@maplibre/maplibre-react-native@11.5.1': patches/@maplibre__maplibre-react-native@11.5.1.patch
  react-native-svg@15.16.1: patches/react-native-svg@15.16.1.patch
