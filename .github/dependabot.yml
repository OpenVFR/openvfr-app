version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Expo SDK pins these; bump them only via `expo install --fix` as part
      # of a coordinated SDK upgrade, not as bot PRs. react-native 0.x minors
      # are breaking and each SDK expects one exact version, so ignore minors
      # too. Babel majors must match what babel-preset-expo supports; CI
      # never runs Metro, so a green check would not catch a break.
      - dependency-name: expo
        update-types: [version-update:semver-major]
      - dependency-name: react-native
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: "@babel/core"
        update-types: [version-update:semver-major]
      # React Native's bundled renderer requires the exact same `react`
      # version, so apps/native's react can only move with react-native.
      # A pnpm workspace can't be split into per-directory Dependabot
      # entries (the root lockfile only updates from `/`), so these are
      # ignored repo-wide and bumped by hand (web and native separately).
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: "@types/react"
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: "@types/react-dom"
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: "@maplibre/maplibre-react-native"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
