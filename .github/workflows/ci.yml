name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # gitleaks/gitleaks-action@v2 now requires a paid GITLEAKS_LICENSE for
      # organization-owned repos (this repo is under the OpenVFR org) --
      # only the convenience Action wrapper enforces this, the underlying
      # OSS gitleaks CLI itself (Apache-2.0) is free regardless of account
      # type. Run it directly instead of paying for the wrapper.
      - name: Install gitleaks
        # Pinned version -- verified against the GitHub API (not guessed)
        # at the time this was written. Bump periodically; check
        # https://api.github.com/repos/gitleaks/gitleaks/releases/latest
        # for the current version + exact asset name before changing.
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Run gitleaks
        run: gitleaks detect --source . --verbose --redact

  build-and-test:
    name: Build, test, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `version:` here -- pnpm/action-setup@v6 refuses to run when a
      # version is specified BOTH here and via package.json's
      # `packageManager` field (even if they match), erroring
      # "Multiple versions of pnpm specified". package.json's
      # packageManager field is the single source of truth; this action
      # reads it automatically when no version input is given.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # THIRD-PARTY-NOTICES.md (licence notices for the shipped npm packages)
      # is generated from the lockfile. Regenerate on Linux:
      #   node scripts/third-party-notices.mjs
      # (platform-specific optional packages differ on macOS/Windows.) Also
      # fails on a licence OSS-POLICY.md does not allow.
      - name: Third-party notices up to date
        run: node scripts/third-party-notices.mjs --check

      - name: Build web app
        run: pnpm --filter web build

      - name: Test (web + shared)
        run: pnpm --filter web test

      # Fails when an Expo-managed dependency (expo-*, react-native, ...)
      # drifts from the versions the installed Expo SDK expects -- e.g. a
      # dependency-bot bump that typechecks fine but breaks native builds.
      # Packages in apps/native package.json `expo.install.exclude` are
      # deliberately skipped.
      - name: Check native deps match Expo SDK
        working-directory: apps/native
        run: pnpm exec expo install --check

      - name: Typecheck native app
        run: pnpm --filter native typecheck

      # Guards the resolved Expo config: blocked Android permissions and the
      # iOS motion usage string (needed for the barometer).
      - name: Check native permission policy
        run: pnpm --filter native check:permissions

      - name: Typecheck API server
        run: pnpm --filter api typecheck

      - name: Test API server
        run: pnpm --filter api test

  docs-links:
    name: Check user guide links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Offline: only checks that relative links and anchors between guide
      # pages and images resolve; external URLs are not fetched.
      - name: Check relative links in docs/guide
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --no-progress 'docs/guide/**/*.md'
          fail: true

  docs-settings:
    name: Check settings.md matches code defaults
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # No install needed: plain node script reading source files.
      - name: Compare setting defaults with docs/guide/settings.md
        run: node scripts/check-settings-docs.mjs
