name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # gitleaks/gitleaks-action@v2 now requires a paid GITLEAKS_LICENSE for
      # organization-owned repos (this repo is under the OpenVFR org) --
      # only the convenience Action wrapper enforces this, the underlying
      # OSS gitleaks CLI itself (Apache-2.0) is free regardless of account
      # type. Run it directly instead of paying for the wrapper.
      - name: Install gitleaks
        # Pinned version -- verified against the GitHub API (not guessed)
        # at the time this was written. Bump periodically; check
        # https://api.github.com/repos/gitleaks/gitleaks/releases/latest
        # for the current version + exact asset name before changing.
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Run gitleaks
        run: gitleaks detect --source . --verbose --redact

  build-and-test:
    name: Build, test, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `version:` here -- pnpm/action-setup@v6 refuses to run when a
      # version is specified BOTH here and via package.json's
      # `packageManager` field (even if they match), erroring
      # "Multiple versions of pnpm specified". package.json's
      # packageManager field is the single source of truth; this action
      # reads it automatically when no version input is given.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --filter web build

      - name: Test (web + shared)
        run: pnpm --filter web test

      - name: Typecheck native app
        run: pnpm --filter native typecheck

      - name: Typecheck API server
        run: pnpm --filter api typecheck
