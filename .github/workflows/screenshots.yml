name: Store screenshots

# Generates App Store (iPhone 6.9" + iPad 13") and Google Play (phone, 7"
# and 10" tablet) screenshots on GitHub-hosted runners -- no Mac or physical
# device needed. iOS runs on the macos-latest simulator, Android on an
# emulator (reactivecircus/android-emulator-runner) on ubuntu-latest; both
# drive the app with the same Maestro flow (apps/native/.maestro/).
#
# Builds use the `screenshots` EAS profile (apps/native/eas.json): iOS
# simulator build + Android APK, `--local` for the same reasons as
# build-*.yml, pulling the `production` EAS environment so the app talks to
# the same backend a store build would. Output: one `screenshots-*` artifact
# per form factor. Nothing is uploaded to the stores.
#
# See .github/workflows/README.md#store-screenshots for secrets + sizes.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to build and capture
        type: choice
        options: [all, ios, android]
        default: all

permissions:
  contents: read

concurrency:
  # Per platform, so an ios run and an android run don't cancel each other.
  group: screenshots-${{ inputs.platform }}
  cancel-in-progress: true

env:
  MAESTRO_VERSION: 2.10.0

jobs:
  # Fail fast (before ~30 min of native builds) if the runner can't reach
  # the data hosts, e.g. edge bot protection challenging datacenter IPs.
  preflight:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Check test-account secrets
        env:
          TEST_EMAIL: ${{ secrets.APP_REVIEW_TEST_EMAIL }}
          TEST_OTP: ${{ secrets.APP_REVIEW_TEST_OTP }}
        run: |
          [ -n "$TEST_EMAIL" ] && [ -n "$TEST_OTP" ] || {
            echo "::error::APP_REVIEW_TEST_EMAIL / APP_REVIEW_TEST_OTP secrets must be set"; exit 1; }
      - name: Check data hosts reachable from runner
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
          EAS_OWNER: ${{ vars.EAS_OWNER }}
        run: |
          npx eas-cli env:pull --environment production --non-interactive --path "$RUNNER_TEMP/eas.env"
          bash .maestro/check-data-hosts.sh "$RUNNER_TEMP/eas.env"

  build_android:
    needs: preflight
    if: inputs.platform != 'ios'
    runs-on: ubuntu-latest
    # Bounded so a repeat of the lintVitalAnalyzeRelease Metaspace hang (or
    # any other future stuck build) fails within the hour instead of running
    # to GitHub's default 360-minute job ceiling.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/native
    steps:
      - name: Free up disk space
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk-bundle /opt/ghc "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/share/boost /usr/local/lib/android/sdk/cmake
          docker image prune -a -f || true
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('pnpm-lock.yaml', 'apps/native/package.json') }}
          restore-keys: |
            gradle-android-
      - name: Enable Gradle build cache
        run: |
          mkdir -p ~/.gradle
          # -XX:MaxMetaspaceSize= is a defensive floor, not the primary fix --
          # withAndroidDisableLintVital.js (apps/native/plugins) removes the
          # actual OOM cause (parallel lintVitalAnalyzeRelease across every RN
          # library subproject). Kept as cheap insurance against other
          # Metaspace-heavy tasks (Kotlin/NDK compilation) under
          # org.gradle.parallel.
          printf 'org.gradle.caching=true\norg.gradle.parallel=true\norg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m\n' >> ~/.gradle/gradle.properties
          # The screenshot APK only runs on the x86_64 emulators (plus
          # arm64-v8a so the same APK can be sideloaded onto a phone to
          # check). User-home gradle.properties overrides the project's,
          # which lists all four ABIs -- halves native compile time.
          echo 'reactNativeArchitectures=x86_64,arm64-v8a' >> ~/.gradle/gradle.properties
      # C/C++ (CMake/NDK) output is NOT covered by the Gradle build cache
      # above -- without ccache every run recompiled React Native, Hermes,
      # Reanimated, MapLibre etc. from scratch for every ABI (~20 min).
      # React Native's own CMake files use ccache when it's on PATH; the
      # CMAKE_*_COMPILER_LAUNCHER env vars (CMake >= 3.17) extend that to
      # every library's CMake project. EAS local builds otherwise use a new
      # random working dir per run, and absolute paths are part of the
      # ccache hash, so pin it (EAS_LOCAL_BUILD_WORKINGDIR) and set
      # CCACHE_BASEDIR to it.
      - name: Cache ccache (NDK compile cache)
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-android-screenshots-${{ hashFiles('pnpm-lock.yaml', 'apps/native/package.json') }}
          restore-keys: |
            ccache-android-screenshots-
      - name: Install ccache
        run: |
          sudo apt-get install -y --no-install-recommends ccache >/dev/null
          {
            echo "CCACHE_DIR=$HOME/.cache/ccache"
            echo "CCACHE_MAXSIZE=3G"
            echo "CCACHE_BASEDIR=$RUNNER_TEMP/eas-build"
            echo "CCACHE_NOHASHDIR=true"
            echo "EAS_LOCAL_BUILD_WORKINGDIR=$RUNNER_TEMP/eas-build"
            echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
          } >> "$GITHUB_ENV"
          ccache --zero-stats
      - name: Build APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
          EAS_OWNER: ${{ vars.EAS_OWNER }}
        run: |
          npx eas-cli build --platform android --profile screenshots --local --non-interactive
          apks=(build-*.apk)
          mv "${apks[0]}" openvfr-screenshots.apk
          ccache --show-stats
      - uses: actions/upload-artifact@v7
        with:
          name: android-screenshots-apk
          path: apps/native/openvfr-screenshots.apk
          retention-days: 3

  android:
    needs: build_android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Every job signs in as the same review account. Signing in consumes
      # that account's stored one-time code, so concurrent jobs make each
      # other fail with "Invalid OTP" (and share the send rate limit).
      max-parallel: 1
      matrix:
        include:
          # Play: max 2:1 aspect, 320-3840 px. 16:9 phone qualifies for
          # featuring; tablets need >= 600dp smallest width to get the
          # tablet UI (1200/320*160 = 600dp, 1600/320*160 = 800dp).
          - name: phone
            profile: pixel_6
            size: 1080x1920
            density: 420
          - name: tablet-7
            profile: pixel_tablet
            size: 1200x1920
            density: 320
          - name: tablet-10
            profile: pixel_tablet
            size: 1600x2560
            density: 320
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: android-screenshots-apk
          path: ${{ runner.temp }}/apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Capture
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MAESTRO_TEST_EMAIL: ${{ secrets.APP_REVIEW_TEST_EMAIL }}
          MAESTRO_TEST_OTP: ${{ secrets.APP_REVIEW_TEST_OTP }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -skin ${{ matrix.size }}
          disable-animations: true
          script: bash apps/native/.maestro/capture-android.sh "${{ runner.temp }}/apk/openvfr-screenshots.apk" "${{ runner.temp }}/shots" ${{ matrix.size }} ${{ matrix.density }}
      # Only PNGs land in shots/ (run-flow.sh keeps Maestro's own artifact
      # folder, which logs typed text including the test OTP, in a temp dir).
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-android-${{ matrix.name }}
          path: ${{ runner.temp }}/shots/
          if-no-files-found: error
          retention-days: 30

  ios:
    # After the Android jobs, not beside them: same review account, see the
    # max-parallel note on the android job. !cancelled() so a failed or
    # skipped Android run doesn't skip iOS.
    needs: [preflight, android]
    if: ${{ !cancelled() && inputs.platform != 'android' }}
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile
      # macOS runners egress from different IP ranges than ubuntu ones --
      # re-check here instead of trusting the preflight job.
      - name: Check data hosts reachable from runner
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
          EAS_OWNER: ${{ vars.EAS_OWNER }}
        run: |
          npx eas-cli env:pull --environment production --non-interactive --path "$RUNNER_TEMP/eas.env"
          bash .maestro/check-data-hosts.sh "$RUNNER_TEMP/eas.env"
      - name: Cache CocoaPods
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ hashFiles('pnpm-lock.yaml', 'apps/native/package.json') }}
          restore-keys: |
            pods-
      - name: Cache ccache (simulator build)
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ccache
          key: ccache-ios-sim-${{ hashFiles('pnpm-lock.yaml', 'apps/native/package.json') }}
          restore-keys: |
            ccache-ios-sim-
      - name: Install ccache
        run: |
          brew install ccache
          echo "CCACHE_DIR=$HOME/Library/Caches/ccache" >> "$GITHUB_ENV"
          # EAS local builds use a new random working dir per run; absolute
          # paths are part of the ccache hash, so without pinning it every
          # compile misses. Pin it and make paths under it relative.
          echo "EAS_LOCAL_BUILD_WORKINGDIR=$RUNNER_TEMP/eas-build" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$RUNNER_TEMP/eas-build" >> "$GITHUB_ENV"
          echo "CCACHE_NOHASHDIR=true" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"
          echo "$(brew --prefix)/opt/ccache/libexec" >> "$GITHUB_PATH"
      - name: Build simulator app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
          EAS_OWNER: ${{ vars.EAS_OWNER }}
        run: |
          npx eas-cli build --platform ios --profile screenshots --local --non-interactive
          ccache --show-stats
          mkdir -p "$RUNNER_TEMP/app"
          archives=(build-*.tar.gz)
          tar -xzf "${archives[0]}" -C "$RUNNER_TEMP/app"
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Capture
        env:
          MAESTRO_TEST_EMAIL: ${{ secrets.APP_REVIEW_TEST_EMAIL }}
          MAESTRO_TEST_OTP: ${{ secrets.APP_REVIEW_TEST_OTP }}
          # The XCTest driver install/launch on a cold simulator regularly
          # outlasts Maestro's default wait on hosted macOS runners (ms).
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
        run: |
          app=$(find "$RUNNER_TEMP/app" -maxdepth 2 -name '*.app' -type d | head -n1)
          bash .maestro/capture-ios.sh "$app" "$RUNNER_TEMP/shots"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-ios
          path: ${{ runner.temp }}/shots/
          if-no-files-found: error
          retention-days: 30
