name: Build iOS

# Uses `eas build --local` (compiles on this runner), not EAS's cloud build
# queue and not manual xcodebuild + keychain juggling (unlike a sibling
# project's Capacitor-based workflow). Reasons:
#   - This is a public repo: GitHub Actions minutes are unlimited/free on
#     GitHub-hosted runners, macOS included. EAS Build's cloud queue is
#     the opposite -- the free tier caps at 15 iOS builds/month with low
#     priority. Building on this (free, unlimited) macos-latest runner
#     instead of dispatching to EAS's (quota-limited) cloud avoids that
#     ceiling entirely.
#   - `--local` still only talks to EAS's servers to fetch the managed
#     signing certificate + provisioning profile (set up once via
#     `eas credentials`), so this does NOT bring back manual keychain/
#     base64-certificate secret handling -- credentials stay centrally
#     managed, only the compute moves to this runner.
#   - apps/native is an Expo *managed* app -- ios/ is generated by
#     `expo prebuild` and is gitignored, so there's no committed
#     Info.plist/xcworkspace to hand-edit for version bumps either way.
#   - `appVersionSource: remote` (apps/native/eas.json) lets EAS own
#     the build number, replacing the manual "diff last build version"
#     dance.
#   - macos-latest GitHub runner images ship Xcode, CocoaPods, and
#     fastlane preinstalled, which `--local` requires (see
#     docs/build-reference/local-builds limitations: no `fastlane`/
#     `cocoapods`/`image` eas.json overrides, no caching -- you own the
#     toolchain).

on:
  workflow_dispatch:
    inputs:
      profile:
        required: false
        default: production
        type: choice
        description: EAS build profile (apps/native/eas.json).
        options:
          - development
          - preview
          - production
      submit:
        required: false
        default: false
        type: boolean
        description: Submit the build to TestFlight after building.

jobs:
  build_ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/native

    steps:
      - name: Checking out branch
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Build (local -- see header comment for why not EAS cloud)
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli build --platform ios --profile ${{ inputs.profile }} --local --non-interactive
          artifact=$(ls build-*.ipa 2>/dev/null | head -n1)
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ inputs.profile }}
          path: apps/native/${{ steps.build.outputs.artifact }}
          retention-days: 30

      - name: Write App Store Connect API key
        if: ${{ inputs.submit == true }}
        run: echo "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}" > app-store-connect-api-key.p8

      - name: Submit to TestFlight
        if: ${{ inputs.submit == true }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: npx eas-cli submit --platform ios --profile production --non-interactive --path "${{ steps.build.outputs.artifact }}"

      - name: Delete App Store Connect API key
        if: always()
        run: rm -f app-store-connect-api-key.p8

      - name: summary
        run: |
          echo "Name: **OpenVFR**" >> "$GITHUB_STEP_SUMMARY"
          echo "Platform: **iOS**" >> "$GITHUB_STEP_SUMMARY"
          echo "Profile: **${{ inputs.profile }}**" >> "$GITHUB_STEP_SUMMARY"
