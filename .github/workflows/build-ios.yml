name: Build iOS

# Uses `eas build --local` (compiles on this runner), not EAS's cloud build
# queue and not manual xcodebuild + keychain juggling (unlike a sibling
# project's Capacitor-based workflow). Reasons:
#   - This is a public repo: GitHub Actions minutes are unlimited/free on
#     GitHub-hosted runners, macOS included. EAS Build's cloud queue is
#     the opposite -- the free tier caps at 15 iOS builds/month with low
#     priority. Building on this (free, unlimited) macos-latest runner
#     instead of dispatching to EAS's (quota-limited) cloud avoids that
#     ceiling entirely.
#   - `--local` still only talks to EAS's servers to fetch the managed
#     signing certificate + provisioning profile (set up once via
#     `eas credentials`), so this does NOT bring back manual keychain/
#     base64-certificate secret handling -- credentials stay centrally
#     managed, only the compute moves to this runner.
#   - apps/native is an Expo *managed* app -- ios/ is generated by
#     `expo prebuild` and is gitignored, so there's no committed
#     Info.plist/xcworkspace to hand-edit for version bumps either way.
#   - `appVersionSource: remote` (apps/native/eas.json) lets EAS own
#     the build number, replacing the manual "diff last build version"
#     dance.
#   - macos-latest GitHub runner images ship Xcode, CocoaPods, and
#     fastlane preinstalled, which `--local` requires (see
#     docs/build-reference/local-builds limitations: no `fastlane`/
#     `cocoapods`/`image` eas.json overrides, no caching -- you own the
#     toolchain).

on:
  workflow_dispatch:
    inputs:
      profile:
        required: false
        default: production
        type: choice
        description: EAS build profile (apps/native/eas.json).
        options:
          - development
          - preview
          - production
      submit:
        required: false
        default: false
        type: boolean
        description: Submit the build to TestFlight after building.

jobs:
  build_ios:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/native

    steps:
      - name: Checking out branch
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      # ios/ is gitignored (regenerated by prebuild), so no committed
      # Podfile.lock to hash pre-build -- key on the native dep manifests
      # that determine it instead. CocoaPods skips reinstall only when
      # Podfile.lock content matches, so no staleness risk on a dep bump.
      - name: Cache CocoaPods
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ hashFiles('pnpm-lock.yaml', 'apps/native/package.json') }}
          restore-keys: |
            pods-

      # ccache hashes actual preprocessed source per compile unit, so a
      # source change only misses cache for that unit -- never serves stale
      # object code. Covers the expensive part (clang compiling Hermes,
      # MapLibre Native, other native modules), unlike Podfile resolution.
      # restore + save as separate steps: a plain actions/cache never saves again
      # after an exact key hit (the cache would stay frozen at its first contents)
      # and skips saving when the job fails. The unique run_id key makes every run
      # save an updated cache; the prefix restore picks up the newest one.
      - name: Restore Cache ccache (clang compile cache)
        uses: actions/cache/restore@v6
        with:
          path: ~/Library/Caches/ccache
          key: ccache-ios-${{ hashFiles('pnpm-lock.yaml', 'apps/native/package.json') }}-${{ github.run_id }}
          restore-keys: |
            ccache-ios-

      # Xcode invokes clang by absolute path, so a ccache shim dir on PATH
      # does nothing for xcodebuild. React Native's own integration is the
      # only way in: USE_CCACHE=1 at `pod install` sets CC/CXX/LD to
      # scripts/xcode/ccache-clang{,++}.sh, and those launchers run
      # `exec $CCACHE_BINARY clang "$@"`. pod install stores CCACHE_BINARY
      # as an Xcode *build setting*, but Xcode doesn't export build settings
      # into a compile task's environment, so the variable is empty and the
      # launcher silently runs plain clang (0 cacheable calls; RN PR #58066
      # is open for it). Exporting CCACHE_BINARY as a real environment
      # variable here reaches the launcher through eas-cli -> fastlane ->
      # xcodebuild and makes the integration work.
      - name: Install ccache
        run: |
          brew install ccache
          {
            echo "CCACHE_DIR=$HOME/Library/Caches/ccache"
            # EAS local builds use a new random working dir per run;
            # absolute paths are part of the ccache hash, so without
            # pinning it every compile misses. Pin it and make paths under
            # it relative.
            echo "EAS_LOCAL_BUILD_WORKINGDIR=$RUNNER_TEMP/eas-build"
            echo "CCACHE_BASEDIR=$RUNNER_TEMP/eas-build"
            echo "CCACHE_NOHASHDIR=true"
            echo "CCACHE_MAXSIZE=2G"
            echo "USE_CCACHE=1"
            echo "CCACHE_BINARY=$(brew --prefix)/bin/ccache"
          } >> "$GITHUB_ENV"
          ccache --zero-stats

      - name: Build (local -- see header comment for why not EAS cloud)
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
          EAS_OWNER: ${{ vars.EAS_OWNER }}
          EAS_LOCAL_BUILD_SKIP_CLEANUP: "1"  # keep the workdir: source maps / symbols are collected below
        run: |
          npx eas-cli build --platform ios --profile ${{ inputs.profile }} --local --non-interactive
          ccache --show-stats
          # A build that compiles the native modules makes hundreds of
          # cacheable calls; a handful means the launcher fell back to plain
          # clang again (see the Install ccache step). Warn, don't fail --
          # the build itself is fine, just slow.
          calls=$(ccache --print-stats | awk -F'\t' '$1=="cacheable_calls"{print $2}')
          [ "${calls:-0}" -ge 100 ] || echo "::warning::ccache saw only ${calls:-0} cacheable compiler calls; iOS ccache integration is not working"
          artifact=$(ls build-*.ipa 2>/dev/null | head -n1)
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      # Keep the compiled objects even if a later step fails. Only when the build
      # actually ran, so an early failure can't save an empty cache that then
      # shadows a good one in the prefix restore.
      - name: Save Cache ccache (clang compile cache)
        if: ${{ always() && steps.build.conclusion != 'skipped' }}
        uses: actions/cache/save@v6
        with:
          path: ~/Library/Caches/ccache
          key: ccache-ios-${{ hashFiles('pnpm-lock.yaml', 'apps/native/package.json') }}-${{ github.run_id }}
      # Verifies whether ccache actually engaged (CC/CXX env may be ignored
      # by xcodebuild depending on target toolchain resolution) -- check
      # cache hit rate here rather than assume it worked.
      - name: ccache stats
        if: always()
        run: ccache -s

      # Which store build is this? Version numbers are owned by EAS (remote
      # versioning), so read them from the finished .ipa and put them, with the
      # commit, in the run summary and the diagnostics artifact name. A crash in
      # TestFlight / App Store Connect (version + build) then maps to one run.
      - name: Build info (store version -> symbols)
        id: info
        if: ${{ always() && steps.build.conclusion == 'success' }}
        run: |
          f="${{ steps.build.outputs.artifact }}"
          name=""; code=""
          if [ -n "$f" ]; then
            rm -rf .ipa-info && mkdir .ipa-info
            unzip -q -o "$f" 'Payload/*.app/Info.plist' -d .ipa-info || true
            plist=$(ls .ipa-info/Payload/*.app/Info.plist 2>/dev/null | head -n1)
            if [ -n "$plist" ]; then
              name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist" 2>/dev/null || true)
              code=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist" 2>/dev/null || true)
            fi
            rm -rf .ipa-info
          fi
          sha=$(git rev-parse --short=10 HEAD)
          tag="v${name:-unknown}-${code:-unknown}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          {
            echo "### iOS build ${tag}"
            echo "| | |"; echo "|---|---|"
            echo "| Profile | ${{ inputs.profile }} |"
            echo "| Version | ${name:-?} |"
            echo "| Build | ${code:-?} |"
            echo "| Commit | \`${sha}\` (${{ github.sha }}) |"
            echo "| File | \`$f\` |"
            echo ""
            echo "Symbols: artifact \`ios-${{ inputs.profile }}-${tag}-diagnostics\` (JS source map, dSYM). App Store Connect / TestFlight shows this build as **${name:-?} (${code:-?})**."
          } >> "$GITHUB_STEP_SUMMARY"

      # Crash diagnostics: Hermes stack frames (p@1:132161) can only be read with
      # the source map of the exact build. Keep it (and the native symbols the
      # build produced) next to the binary. Public repo, nothing secret in them.
      - name: Collect crash-diagnostics files
        if: ${{ always() && steps.build.conclusion == 'success' }}
        run: |
          mkdir -p diag
          # macOS cp has no --parents; a dSYM is a directory. Tar the lot.
          find "$RUNNER_TEMP/eas-build" \( -name 'main.jsbundle*.map' -o -name '*.dSYM' \) -not -path '*/node_modules/*' -prune -print > diag/list.txt || true
          [ -s diag/list.txt ] && tar -czf diag/ios-diagnostics.tgz -T diag/list.txt || echo "::warning::no source map / dSYM found in the EAS workdir"
          rm -f diag/list.txt
          find diag -type f | head -20
      - name: Upload crash-diagnostics files
        if: ${{ always() && steps.build.conclusion == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-${{ inputs.profile }}-${{ steps.info.outputs.tag }}-diagnostics
          path: diag
          if-no-files-found: warn
          retention-days: 90

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-${{ inputs.profile }}
          path: apps/native/${{ steps.build.outputs.artifact }}
          retention-days: 30

      - name: Write App Store Connect API key
        if: ${{ inputs.submit == true }}
        run: echo "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}" > app-store-connect-api-key.p8

      - name: Inject App Store Connect IDs into eas.json (runtime only, not committed)
        if: ${{ inputs.submit == true }}
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_APP_ID: ${{ vars.APP_STORE_CONNECT_APP_ID }}
        run: |
          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
            c.submit.production.ios.ascApiKeyId = process.env.ASC_KEY_ID;
            c.submit.production.ios.ascApiKeyIssuerId = process.env.ASC_ISSUER_ID;
            c.submit.production.ios.ascAppId = process.env.ASC_APP_ID;
            fs.writeFileSync('eas.json', JSON.stringify(c, null, 2));
          "

      - name: Submit to TestFlight
        if: ${{ inputs.submit == true }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
          EAS_OWNER: ${{ vars.EAS_OWNER }}
        run: npx eas-cli submit --platform ios --profile production --non-interactive --path "${{ steps.build.outputs.artifact }}"

      - name: Delete App Store Connect API key
        if: always()
        run: rm -f app-store-connect-api-key.p8

      - name: summary
        run: |
          echo "Name: **OpenVFR**" >> "$GITHUB_STEP_SUMMARY"
          echo "Platform: **iOS**" >> "$GITHUB_STEP_SUMMARY"
          echo "Profile: **${{ inputs.profile }}**" >> "$GITHUB_STEP_SUMMARY"
