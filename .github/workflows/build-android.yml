name: Build Android

# Uses `eas build --local` (compiles on this runner), not EAS's cloud build
# queue and not a manual gradle/keystore pipeline (unlike a sibling
# project's Capacitor-based workflow). Reasons:
#   - This is a public repo: GitHub Actions minutes are unlimited/free on
#     GitHub-hosted runners regardless of OS. EAS Build's cloud queue is
#     the opposite -- the free tier caps at 15 Android + 15 iOS builds/
#     month with low priority. Building on the (free, unlimited) runner
#     instead of dispatching to EAS's (quota-limited) cloud avoids that
#     ceiling entirely.
#   - `--local` still only talks to EAS's servers to fetch the managed
#     release keystore (generated once via `eas credentials`), so this
#     does NOT bring back manual keystore-secret decoding -- credentials
#     stay centrally managed, only the compute moves to this runner.
#   - apps/native is an Expo *managed* app -- android/ is generated by
#     `expo prebuild` and is gitignored (see apps/native/android in
#     .gitignore), so there is no committed build.gradle to sed a
#     versionCode into either way.
#   - `appVersionSource: remote` (apps/native/eas.json) lets EAS own
#     versionCode/versionName bumps, replacing the manual "download last
#     build version from blob storage, diff, increment" dance.
#   - ubuntu-latest GitHub runner images ship a preinstalled Android SDK/
#     NDK, which `--local` requires (see docs/build-reference/local-builds
#     limitations: no `node`/`yarn`/`ndk`/`image` eas.json overrides, no
#     caching -- you own the toolchain).

on:
  workflow_dispatch:
    inputs:
      profile:
        required: false
        default: production
        type: choice
        description: EAS build profile (apps/native/eas.json).
        options:
          - development
          - preview
          - production
      submit:
        required: false
        default: false
        type: boolean
        description: Submit the build to the Play Store after building.
      track:
        default: internal
        required: true
        type: choice
        description: Play Store track to submit to (only used if submit is true).
        options:
          - internal
          - alpha
          - beta
          - production

jobs:
  build_android:
    runs-on: ubuntu-latest
    # Bounded so a stuck build (e.g. the lintVitalAnalyzeRelease Metaspace
    # hang this once hit -- see withAndroidDisableLintVital.js) fails within
    # the hour instead of running to GitHub's default 360-minute ceiling.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/native

    steps:
      - name: Free up disk space (ubuntu-latest ships ~14GB free; native Android build needs it)
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk-bundle /opt/ghc "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/share/boost /usr/local/lib/android/sdk/cmake
          docker image prune -a -f || true
          df -h /

      - name: Checking out branch
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      # Gradle's build cache keys each task's output by a hash of its real
      # inputs (source content, deps, flags) -- a source change invalidates
      # only that task's cache entry, never serves stale output. Safe to
      # share across runs; ~/.gradle/wrapper just avoids redownloading the
      # wrapper zip.
      - name: Cache Gradle (JVM build outputs)
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('pnpm-lock.yaml', 'apps/native/package.json') }}
          restore-keys: |
            gradle-android-

      - name: Enable Gradle build cache
        run: |
          mkdir -p ~/.gradle
          # -XX:MaxMetaspaceSize= is a defensive floor, not the primary fix --
          # withAndroidDisableLintVital.js (apps/native/plugins) removes the
          # actual OOM cause (parallel lintVitalAnalyzeRelease across every RN
          # library subproject -- see that file for the full story). Kept as
          # cheap insurance against other Metaspace-heavy tasks (Kotlin/NDK
          # compilation) under org.gradle.parallel.
          printf 'org.gradle.caching=true\norg.gradle.parallel=true\norg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m\n' >> ~/.gradle/gradle.properties

      # C/C++ (CMake/NDK) output is NOT covered by the Gradle build cache
      # above -- without ccache every run recompiled React Native, Hermes,
      # Reanimated, MapLibre etc. from scratch for every ABI (~20 min).
      # React Native's own CMake files use ccache when it's on PATH; the
      # CMAKE_*_COMPILER_LAUNCHER env vars (CMake >= 3.17) extend that to
      # every library's CMake project. EAS local builds otherwise use a new
      # random working dir per run, and absolute paths are part of the
      # ccache hash, so pin it (EAS_LOCAL_BUILD_WORKINGDIR) and set
      # CCACHE_BASEDIR to it.
      - name: Cache ccache (NDK compile cache)
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-android-${{ inputs.profile }}-${{ hashFiles('pnpm-lock.yaml', 'apps/native/package.json') }}
          restore-keys: |
            ccache-android-${{ inputs.profile }}-
      - name: Install ccache
        run: |
          sudo apt-get install -y --no-install-recommends ccache >/dev/null
          {
            echo "CCACHE_DIR=$HOME/.cache/ccache"
            echo "CCACHE_MAXSIZE=3G"
            echo "CCACHE_BASEDIR=$RUNNER_TEMP/eas-build"
            echo "CCACHE_NOHASHDIR=true"
            echo "EAS_LOCAL_BUILD_WORKINGDIR=$RUNNER_TEMP/eas-build"
            echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
          } >> "$GITHUB_ENV"
          ccache --zero-stats
      - name: Build (local -- see header comment for why not EAS cloud)
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
          EAS_OWNER: ${{ vars.EAS_OWNER }}
        run: |
          # No --output: profile decides .apk (preview) vs .aab (production);
          # eas-cli names the file itself -- capture whichever it produced.
          npx eas-cli build --platform android --profile ${{ inputs.profile }} --local --non-interactive
          ccache --show-stats
          artifact=$(ls build-*.apk build-*.aab 2>/dev/null | head -n1)
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ inputs.profile }}
          path: apps/native/${{ steps.build.outputs.artifact }}
          retention-days: 30

      - name: Write Play Store service account key
        if: ${{ inputs.submit == true }}
        run: echo '${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}' > google-service-account.json

      - name: Submit to Play Store
        if: ${{ inputs.submit == true }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
          EAS_OWNER: ${{ vars.EAS_OWNER }}
        run: npx eas-cli submit --platform android --profile production --non-interactive --path "${{ steps.build.outputs.artifact }}" --track "${{ inputs.track }}"

      - name: Delete service account key
        if: always()
        working-directory: .
        run: rm -f apps/native/google-service-account.json

      - name: summary
        run: |
          echo "Name: **OpenVFR**" >> "$GITHUB_STEP_SUMMARY"
          echo "Platform: **Android**" >> "$GITHUB_STEP_SUMMARY"
          echo "Profile: **${{ inputs.profile }}**" >> "$GITHUB_STEP_SUMMARY"
