server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's embedded DNS resolver.
    # Setting a variable for proxy_pass defers hostname resolution to request
    # time rather than nginx startup — prevents "host not found in upstream"
    # crashes when sibling containers (postgrest, api) start after this one.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Gzip for text assets — disabled for binary tile files
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml;

    # ── Elevation API proxy (avoids browser CORS restriction) ──────────────
    location /api/elevation/ {
        proxy_pass https://api.opentopodata.org/v1/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.opentopodata.org;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
    }

    # ── Open-Meteo winds-aloft proxy ────────────────────────────────────────
    location /api/open-meteo/ {
        proxy_pass https://api.open-meteo.com/v1/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.open-meteo.com;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
    }

    # ── PostgREST REST API (user data sync) ──────────────────────────────────
    # Variable-based proxy_pass so DNS is resolved at request time, not startup.
    location /rest/ {
        set $postgrest_upstream http://postgrest:3001;
        proxy_pass $postgrest_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Connection "";
    }

    # ── better-auth endpoints ────────────────────────────────────────────────
    # All /api/auth/** routes are handled by the Hono server.
    location /api/auth/ {
        set $api_upstream http://api:5200;
        proxy_pass $api_upstream/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Connection "";
    }

    # ── Weather + NOTAM privacy proxy (via open-vfr API server) ────────────
    # Client IP is stripped before any upstream request in the Node server.
    location /api/weather {
        set $api_upstream http://api:5200;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
    }

    location /api/notam {
        set $api_upstream http://api:5200;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
    }
    # ── Hashed JS/CSS assets ────────────────────────────────────────────────
    # Vite emits content-hashed files under /assets/. They are immutable for
    # the lifetime of a deploy — cache them for 1 year.
    # CRITICAL: return 404 (not index.html) when a hash is missing.
    # If try_files falls back to index.html, the browser receives text/html
    # for a module script request and throws "wrong MIME type" on the next
    # page load after a deploy (until hard-reload / SW update).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        gzip_static on;
    }

    # ── SPA routing ─────────────────────────────────────────────────────────
    # Unknown paths fall back to index.html so React Router can handle them.
    # index.html must never be cached — it contains hashed asset filenames that
    # change on every build. CDNs and browsers must always revalidate.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ── PMTiles static files ─────────────────────────────────────────────────
    # nginx supports HTTP Range requests for static files natively.
    # PMTiles reads tile data via Range requests, so this is the critical path.
    #
    # No proxy_pass here — proxying can strip or rewrite Range/Content-Range
    # headers, which would silently break PMTiles reads.
    location /tiles/ {
        # Ensure the Accept-Ranges header is present (nginx sets it automatically
        # for static files, but we make it explicit for clarity).
        add_header Accept-Ranges bytes always;

        # Disable gzip for binary archives (already compact; gzip adds CPU overhead)
        gzip off;

        # Cache tiles aggressively — they only change on AIRAC cycle updates
        add_header Cache-Control "public, max-age=86400" always;
    }

    # ── Aviation GeoJSON data (aerodromes/airspace/navaids/etc.) ────────────
    # More specific location wins over /tiles/ above. These are hand-edited
    # /backfilled outside the AIRAC cycle (e.g. openaip_fill_aerodrome_gaps.py)
    # and need to propagate to already-installed native app clients within
    # minutes, not a day. must-revalidate forces a conditional GET (nginx
    # auto-sets ETag/Last-Modified) once max-age expires — cheap 304 if
    # unchanged, full body if updated.
    location ~ ^/tiles/.*\.geojson$ {
        add_header Accept-Ranges bytes always;
        gzip_static on;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }
}
