# Store-listing screenshot flow, shared by iOS simulator + Android emulator.
# Driven by .github/workflows/screenshots.yml via capture-{ios,android}.sh.
#
# Env (Maestro auto-imports MAESTRO_* from the process env, so secrets never
# land on a command line):
#   MAESTRO_TEST_EMAIL   app-review test account (APP_REVIEW_TEST_EMAIL on the API)
#   MAESTRO_TEST_OTP     its fixed OTP        (APP_REVIEW_TEST_OTP on the API)
#
# takeScreenshot paths are bare file names: Maestro writes them into its own
# artifact folder, and run-flow.sh copies them out to the capture directory.
#
# Add screens by appending tapOn/takeScreenshot pairs. Keep file names
# numbered -- store consoles order uploads by name.
appId: org.openvfr.app
---
# ESMI (Sjöbo/Sövde), the start of the sample ESMI -> ESMS route built
# below, so the map shot shows the same area as the route.
- setLocation:
    latitude: 55.598
    longitude: 13.677
- launchApp:
    clearState: true
    permissions:
      all: allow

# Update nudge can appear right at launch too (see below).
- tapOn:
    text: "(Next time|Skip this version|Not now|Later)"
    optional: true

# App.tsx shows a bare spinner while restoring the session. runFlow's `when`
# is checked once, without waiting, so on a slow emulator it would see only
# the spinner, skip login, and leave the login screen up. Wait for either
# the login screen or the tab bar first.
# Tabs are matched by testID (navigation/index.tsx), not label text: on iOS
# their accessibility label is "<label>, tab, N of M".
- extendedWaitUntil:
    visible:
      id: "(login-email|tab-plan)"
    timeout: 60000

- runFlow:
    when:
      visible:
        id: login-email
    file: login.yaml

# Tab bar only renders once authenticated.
- extendedWaitUntil:
    visible:
      id: tab-plan
    timeout: 60000

# Soft "update available" nudge (useForceUpdate.ts) fires when the store
# already lists a newer version than this build -- keep it out of shots.
- tapOn:
    text: "(Next time|Skip this version|Not now|Later)"
    optional: true

# Any permission prompt `permissions: all: allow` could not pre-grant.
- tapOn:
    text: "(Allow|Allow while using the app|While using the app)"
    optional: true

- tapOn:
    text: Show my position
    optional: true
# Map tiles + aviation GeoJSON load over the network and aren't in the
# accessibility tree, so there's nothing to assert on -- give them time.
- waitForAnimationToEnd:
    timeout: 20000
- takeScreenshot: 01-map

# Map Display (layers) sheet.
- tapOn:
    id: map-display-open
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 02-map-display
- tapOn:
    id: map-display-close
- waitForAnimationToEnd:
    timeout: 5000

# Build a sample route ESMI -> ESMS through Find a Destination, so the
# Flight Plan tab shows a real route instead of its empty state. clearState
# at launch means the route always starts empty. Aerodromes load on the
# sheet's first open, hence the wait on the first add button. Enter
# submits the search field, which dismisses the keyboard so it can't cover
# the result row. Not hideKeyboard: on Android that sends Back, which closes
# the sheet (Modal onRequestClose).
- tapOn:
    id: find-destination-open
- tapOn:
    id: find-destination-search
- inputText: ESMI
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: find-destination-add-ESMI
    timeout: 30000
- takeScreenshot: 03-find-destination
- tapOn:
    id: find-destination-add-ESMI
- tapOn:
    id: find-destination-search
- eraseText
- inputText: ESMS
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: find-destination-add-ESMS
    timeout: 10000
- tapOn:
    id: find-destination-add-ESMS
- tapOn:
    id: find-destination-close
- waitForAnimationToEnd:
    timeout: 5000

- tapOn:
    id: tab-plan
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: 04-flight-plan
