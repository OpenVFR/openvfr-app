# Store-listing screenshot flow, shared by iOS simulator + Android emulator.
# Driven by .github/workflows/screenshots.yml via capture-{ios,android}.sh.
#
# Env (Maestro auto-imports MAESTRO_* from the process env, so secrets never
# land on a command line):
#   MAESTRO_TEST_EMAIL   app-review test account (APP_REVIEW_TEST_EMAIL on the API)
#   MAESTRO_TEST_OTP     its fixed OTP        (APP_REVIEW_TEST_OTP on the API)
#
# takeScreenshot paths are bare file names: Maestro writes them into its own
# artifact folder, and run-flow.sh copies them out to the capture directory.
#
# The test account is prepared by hand: it must already have a saved route
# (ESMI -> ESMS with a few waypoints) in its Route Library. The flow only
# LOADS it (the most recently saved one is listed first) -- it never creates
# or edits routes. clearState at launch means the app starts with an empty
# working route, and the account's saved routes sync down after sign-in.
#
# Add screens by appending tapOn/takeScreenshot pairs. Keep file names
# numbered -- store consoles order uploads by name.
appId: org.openvfr.app
---
# ESMI (Sjöbo/Sövde), the start of the account's stored ESMI -> ESMS route,
# so the map shot shows the same area as the route.
- setLocation:
    latitude: 55.598
    longitude: 13.677
- launchApp:
    clearState: true
    permissions:
      all: allow

# Update nudge can appear right at launch too (see below).
- tapOn:
    text: "(Next time|Skip this version|Not now|Later)"
    optional: true

# App.tsx shows a bare spinner while restoring the session. runFlow's `when`
# is checked once, without waiting, so on a slow emulator it would see only
# the spinner, skip login, and leave the login screen up. Wait for either
# the login screen or the tab bar first.
# Tabs are matched by testID (navigation/index.tsx), not label text: on iOS
# their accessibility label is "<label>, tab, N of M".
# Belt and braces next to hide_error_dialogs (capture-android.sh): a system
# "isn't responding" dialog would hide every element of the app.
- tapOn:
    text: "Wait"
    optional: true
- tapOn:
    text: "Got it"
    optional: true

- extendedWaitUntil:
    visible:
      id: "(login-email|tab-plan)"
    timeout: 60000

- runFlow:
    when:
      visible:
        id: login-email
    file: login.yaml

# Tab bar only renders once authenticated.
- extendedWaitUntil:
    visible:
      id: tab-plan
    timeout: 60000

# Soft "update available" nudge (useForceUpdate.ts) fires when the store
# already lists a newer version than this build -- keep it out of shots.
- tapOn:
    text: "(Next time|Skip this version|Not now|Later)"
    optional: true

# Any permission prompt `permissions: all: allow` could not pre-grant.
- tapOn:
    text: "(Allow|Allow while using the app|While using the app)"
    optional: true

# Load the account's saved route into the working route, so the map and
# Flight Plan shots show it. Saved routes sync down after sign-in, hence the
# generous wait for the first library row.
- tapOn:
    id: tab-plan
- tapOn:
    id: plan-more-open
- tapOn:
    id: plan-open-library
- extendedWaitUntil:
    visible:
      id: route-library-item
    timeout: 60000
- tapOn:
    id: route-library-item
    index: 0
- waitForAnimationToEnd:
    timeout: 5000

- tapOn:
    id: tab-map
- tapOn:
    text: Show my position
    optional: true
# Map tiles + aviation GeoJSON load over the network and aren't in the
# accessibility tree, so there's nothing to assert on -- give them time.
- waitForAnimationToEnd:
    timeout: 20000
- takeScreenshot: 01-map

# Map Display (layers) sheet.
- tapOn:
    id: map-display-open
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 02-map-display
- tapOn:
    id: map-display-close
- waitForAnimationToEnd:
    timeout: 5000

# Find a Destination sheet, view only: nothing is added to the route. Aerodromes
# load on the sheet's first open, so give them a moment before the shot.
- tapOn:
    id: find-destination-open
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: 03-find-destination
- tapOn:
    id: find-destination-close
- waitForAnimationToEnd:
    timeout: 5000

- tapOn:
    id: tab-plan
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: 04-flight-plan

# Simulate from the route's departure (ESMI): with a route loaded and a flight
# mode active the map shows the vertical profile ("vertical radar") along the
# route. No hardware needed. Last on purpose: flight mode collapses the tab bar.
- tapOn:
    id: tab-map
- tapOn:
    id: flight-mode-open
- tapOn:
    id: flight-mode-start-sim
# The simulator's first position arrives on its first tick; the profile chart
# and terrain sampling render a moment later.
- waitForAnimationToEnd:
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: sim-stop
    timeout: 15000
- takeScreenshot: 05-simulator
