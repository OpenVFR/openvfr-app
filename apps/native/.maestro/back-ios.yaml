# Leaves a pushed screen (Plan / Settings) on iOS. The native header back button
# is labelled with the previous screen's title ("Map") on older iOS, "Back" on
# some, and on iOS 26+ it is an icon-only glass button whose label Maestro does
# not always see (run 41542550423: `tapOn: "Map"` failed on iOS 27). `when:
# visible` is checked once without waiting, unlike an optional tapOn, which
# would burn Maestro's full lookup timeout whenever the label is absent. Order:
# label tap if present, else "Back", else the interactive-pop edge swipe.
appId: org.openvfr.app
---
- runFlow:
    when:
      visible: "Map"
    commands:
      - tapOn: "Map"
- runFlow:
    when:
      notVisible:
        id: map-tools-open
    commands:
      - runFlow:
          when:
            visible: "Back"
          commands:
            - tapOn: "Back"
- runFlow:
    when:
      notVisible:
        id: map-tools-open
    commands:
      - swipe:
          start: 1%, 50%
          end: 75%, 50%
          duration: 400
