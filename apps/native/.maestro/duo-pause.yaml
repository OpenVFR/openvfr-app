# Used by screenshots.yaml on the iPhone Duo only (MAESTRO_DUO=1): holds the
# flow still while run-flow.sh's watcher unfolds the simulator, captures the
# inner display and folds it again. duo-wait.js long-polls the watcher's
# localhost sync server (MAESTRO_DUO_SYNC) until it answers "idle", so the
# flow resumes only on the folded cover, however long the fold took.
appId: org.openvfr.app
---
- runScript:
    file: duo-wait.js
    env:
      SYNC_URL: ${MAESTRO_DUO_SYNC}
- assertTrue: ${output.duoState == 'idle'}
