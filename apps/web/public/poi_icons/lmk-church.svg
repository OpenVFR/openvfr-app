<svg version="1.1" id="place-of-worship" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 15 15">
  <!-- Original artwork's path geometry only reaches y=13 of this 15-tall
       viewBox (2 units, roughly 13% of unused transparent space below the
       church base), unlike every sibling icon (obstacle/landmark), which
       fills its full viewBox edge to edge. Both platforms bottom-anchor
       these icons by placing the SVG/PNG's own bottom edge at ground
       level (see VirtualRadar.tsx/VerticalProfile.tsx's landmark render),
       so that gap made the church glyph float about 13% of its rendered
       size above where it should sit. Vertically scaled by 15/13 (width
       untouched) so the glyph fills the full viewBox height exactly like
       its siblings, instead of redrawing/renumbering every path
       coordinate by hand. -->
