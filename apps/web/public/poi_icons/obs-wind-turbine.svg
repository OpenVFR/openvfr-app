  </g>
  <circle cx="7.5" cy="6.3" r="2.3" fill="#0b1522" fill-opacity="0.85"/>
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7.5 6.3V13" stroke-width="1.1"/>
    <path d="M7.5 6.3L6.06 2.35M7.5 6.3L11.64 7.03M7.5 6.3L4.8 9.52" stroke-width="1.5"/>
  </g>
  <circle cx="7.5" cy="6.3" r="1.5" fill="#fff"/>
